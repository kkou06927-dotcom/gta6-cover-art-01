<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PosterForge — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>PosterForge</h1>
    <p class="tagline">Your photos + a caption, made into a GTA-poster-style cover.</p>

    <label class="field">Photos
      <input id="photo" type="file" accept="image/*" multiple>
    </label>
    <div id="library" class="library" aria-label="Sample photos"></div>

    <div class="group">
      <span class="group-label">Layout</span>
      <div class="row">
        <button type="button" data-layout="duo">Duo</button>
        <button type="button" data-layout="trio">Trio</button>
        <button type="button" data-layout="quad" class="active">Quad</button>
        <button type="button" data-layout="five">Five</button>
      </div>
    </div>

    <div class="group">
      <span class="group-label">Colour grade</span>
      <div class="row">
        <button type="button" data-grade="sunset" class="active">Vice Sunset</button>
        <button type="button" data-grade="neon">Neon Nights</button>
        <button type="button" data-grade="golden">Golden Hour</button>
        <button type="button" data-grade="clean">Clean</button>
      </div>
    </div>

    <label class="field">Title
      <input id="title" type="text" maxlength="32" value="Neon Harbor">
    </label>
    <label class="field">Subtitle
      <input id="subtitle" type="text" maxlength="40" value="Vice City Nights">
    </label>

    <div class="group">
      <span class="group-label">Selected panel</span>
      <div id="panels" class="panels"></div>
      <label class="field">Zoom
        <input id="zoom" type="range" min="1" max="3" step="0.05" value="1">
      </label>
      <button id="fillAll" type="button">Fill all panels</button>
    </div>

    <label class="field">Export size
      <select id="size">
        <option value="square" selected>1080 × 1080</option>
        <option value="portrait">1080 × 1350</option>
        <option value="wide">1920 × 1080</option>
      </select>
    </label>
    <button id="export" type="button" class="primary">Export PNG</button>
    <p id="status" role="status"></p>
    <p class="hint">Click a panel to select it, drag its photo to reposition, scroll to zoom. Drop photos straight onto the preview.</p>
  </section>
  <canvas id="cover" width="1080" height="1080" aria-label="The cover preview"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
